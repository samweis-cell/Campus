<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Schul-Planer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1 id="header-title">Heute</h1>
    <span id="header-date" class="date-badge"></span>
  </header>

  <!-- Hauptinhalt (Tabs) -->
  <main class="content">
    
    <!-- Tab 1: HEUTE -->
    <section id="tab-heute" class="tab-content active">
      <div class="card status-card">
        <span class="status-tag" id="status-tag">Status</span>
        <h2 id="current-subject">Frei</h2>
        <p id="current-details">Kein Unterricht aktuell</p>
        <p class="next-up" id="next-subject">-</p>
      </div>

      <h3>📝 Heute erledigen</h3>
      <div id="heute-tasks" class="task-list"></div>

      <h3>🎒 Nicht vergessen</h3>
      <div id="heute-packlist" class="pack-list"></div>
    </section>

    <!-- Tab 2: STUNDENPLAN -->
    <section id="tab-stundenplan" class="tab-content">
      <div class="section-header">
        <h2>Stundenplan</h2>
        <button class="btn-primary" onclick="addScheduleItem()">+ Stunde eintragen</button>
      </div>
      <div id="schedule-list" class="task-list"></div>
    </section>

    <!-- Tab 3: AUFGABEN -->
    <section id="tab-aufgaben" class="tab-content">
      <div class="section-header">
        <h2>Aufgaben</h2>
        <button class="btn-primary" onclick="addTaskPrompt()">+ Aufgabe</button>
      </div>
      <div id="all-tasks" class="task-list"></div>
    </section>

    <!-- Tab 4: ARBEITEN -->
    <section id="tab-arbeiten" class="tab-content">
      <div class="section-header">
        <h2>Anstehende Arbeiten</h2>
        <button class="btn-primary" onclick="addExamPrompt()">+ Arbeit</button>
      </div>
      <div id="exam-list" class="exam-list"></div>
    </section>

    <!-- Tab 5: NOTEN -->
    <section id="tab-noten" class="tab-content">
      <div class="section-header">
        <h2>Notenübersicht</h2>
        <button class="btn-primary" onclick="addGradePrompt()">+ Note</button>
      </div>
      <div class="card">
        <h3>Gesamtschnitt</h3>
        <p class="grade-badge" id="grade-average">-</p>
      </div>
      <h3>Noten nach Fächern</h3>
      <div id="grades-list" class="task-list"></div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('heute', this)">🏠<span>Heute</span></button>
    <button class="nav-btn" onclick="switchTab('stundenplan', this)">📅<span>Plan</span></button>
    <button class="nav-btn" onclick="switchTab('aufgaben', this)">📝<span>Aufgaben</span></button>
    <button class="nav-btn" onclick="switchTab('arbeiten', this)">🧪<span>Arbeiten</span></button>
    <button class="nav-btn" onclick="switchTab('noten', this)">📊<span>Noten</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
