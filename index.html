<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Schul-Planer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-content">
      <div>
        <h1 id="header-title">Heute</h1>
        <span id="header-date" class="header-date"></span>
      </div>
      <span id="app-version" class="version-badge">v9.0</span>
    </div>
  </header>

  <!-- INHALT -->
  <main class="app-content">

    <!-- TAB 1: HEUTE -->
    <section id="tab-heute" class="tab-content active">
      <div class="card current-card">
        <div class="card-subtitle">Aktuelle Stunde</div>
        <div id="current-subject" class="current-title">Frei 🎉</div>
        <div id="current-details" class="current-sub">Keine Stunden für heute eingetragen</div>
        <div id="next-subject" class="next-title">-</div>
      </div>

      <div class="section-title">Anstehende Aufgaben</div>
      <div id="heute-tasks" class="task-list"></div>
    </section>

    <!-- TAB 2: STUNDENPLAN -->
    <section id="tab-stundenplan" class="tab-content">
      <div class="actions-bar">
        <button id="btn-open-schedule-modal" class="btn btn-primary">+ Stundenplan-Eintrag</button>
      </div>

      <div class="table-container">
        <table class="schedule-table">
          <thead>
            <tr>
              <th>Std / Zeit</th>
              <th>Mo</th>
              <th>Di</th>
              <th>Mi</th>
              <th>Do</th>
              <th>Fr</th>
            </tr>
          </thead>
          <tbody id="schedule-table-body">
            <!-- Wird per JS befüllt -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- TAB 3: AUFGABEN -->
    <section id="tab-aufgaben" class="tab-content">
      <div class="actions-bar">
        <button id="btn-open-task-modal" class="btn btn-primary">+ Aufgabe hinzufügen</button>
      </div>
      <div id="all-tasks" class="task-list"></div>
    </section>

    <!-- TAB 4: ARBEITEN -->
    <section id="tab-arbeiten" class="tab-content">
      <div class="actions-bar">
        <button id="btn-open-exam-modal" class="btn btn-primary">+ Arbeit eintragen</button>
      </div>
      <div id="exam-list" class="task-list"></div>
    </section>

    <!-- TAB 5: NOTEN -->
    <section id="tab-noten" class="tab-content">
      <div class="card summary-card">
        <div class="card-subtitle">Notendurchschnitt</div>
        <div id="grade-average" class="current-title">-</div>
      </div>

      <div class="card simulator-card">
        <h3>Noten-Simulator</h3>
        <p>Welchen Schnitt möchtest du erreichen?</p>
        <div class="form-group inline-group">
          <input type="number" id="sim-target" step="0.1" placeholder="z. B. 2.0">
          <button id="btn-calc-sim" class="btn btn-secondary">Berechnen</button>
        </div>
        <div id="sim-result" class="sim-result"></div>
      </div>

      <div class="actions-bar">
        <button id="btn-open-grade-modal" class="btn btn-primary">+ Note eintragen</button>
      </div>

      <div id="grades-list" class="task-list"></div>
    </section>

  </main>

  <!-- NAVIGATIONSLEISTE UNTEN -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="heute">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Heute</span>
    </button>
    <button class="nav-btn" data-tab="stundenplan">
      <span class="nav-icon">🕒</span>
      <span class="nav-label">Plan</span>
    </button>
    <button class="nav-btn" data-tab="aufgaben">
      <span class="nav-icon">✅</span>
      <span class="nav-label">Aufgaben</span>
    </button>
    <button class="nav-btn" data-tab="arbeiten">
      <span class="nav-icon">📝</span>
      <span class="nav-label">Arbeiten</span>
    </button>
    <button class="nav-btn" data-tab="noten">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Noten</span>
    </button>
  </nav>

  <!-- MODAL BACKDROP -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="closeModal()"></div>

  <!-- MODAL: STUNDENPLAN / PAUSE -->
  <div id="modal-schedule" class="modal-card">
    <h3>Eintrag hinzufügen</h3>
    <form id="form-schedule">
      <div class="form-group">
        <label>Typ</label>
        <select id="sched-type">
          <option value="lesson">Unterrichtsstunde</option>
          <option value="pause">Pause</option>
        </select>
      </div>

      <div id="wrapper-lesson-slot" class="form-group">
        <label>Stunde</label>
        <select id="sched-slot">
          <option value="1">1. Stunde</option>
          <option value="2">2. Stunde</option>
          <option value="3">3. Stunde</option>
          <option value="4">4. Stunde</option>
          <option value="5">5. Stunde</option>
          <option value="6">6. Stunde</option>
          <option value="7">7. Stunde</option>
          <option value="8">8. Stunde</option>
          <option value="9">9. Stunde</option>
          <option value="10">10. Stunde</option>
        </select>
      </div>

      <div id="wrapper-pause-after" class="form-group" style="display: none;">
        <label>Pause nach der Stunde</label>
        <select id="sched-pause-after">
          <option value="1">Nach der 1. Stunde</option>
          <option value="2">Nach der 2. Stunde</option>
          <option value="3">Nach der 3. Stunde</option>
          <option value="4">Nach der 4. Stunde</option>
          <option value="5">Nach der 5. Stunde</option>
          <option value="6">Nach der 6. Stunde</option>
          <option value="7">Nach der 7. Stunde</option>
          <option value="8">Nach der 8. Stunde</option>
          <option value="9">Nach der 9. Stunde</option>
        </select>
      </div>

      <div id="fields-lesson">
        <div class="form-group">
          <label>Tag</label>
          <select id="sched-day">
            <option value="Mo">Montag</option>
            <option value="Di">Dienstag</option>
            <option value="Mi">Mittwoch</option>
            <option value="Do">Donnerstag</option>
            <option value="Fr">Freitag</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fach</label>
          <input type="text" id="sched-subject" placeholder="z. B. Mathematik">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Lehrer</label>
            <input type="text" id="sched-teacher" placeholder="z. B. Hr. Müller">
          </div>
          <div class="form-group">
            <label>Raum</label>
            <input type="text" id="sched-room" placeholder="z. B. A102">
          </div>
        </div>
      </div>

      <div id="fields-pause" style="display: none;">
        <div class="form-group">
          <label>Name der Pause (Optional)</label>
          <input type="text" id="sched-pause-name" placeholder="z. B. Hofpause / Große Pause">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Startzeit (Std : Min)</label>
          <div class="time-input-group">
            <input type="number" id="sched-start-hh" placeholder="HH" min="0" max="23" required>
            <span>:</span>
            <input type="number" id="sched-start-mm" placeholder="MM" min="0" max="59" required>
          </div>
        </div>
        <div class="form-group">
          <label>Dauer (Minuten)</label>
          <input type="number" id="sched-duration" value="45" required>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </div>

  <!-- MODAL: AUFGABE -->
  <div id="modal-task" class="modal-card">
    <h3>Neue Aufgabe</h3>
    <form id="form-task">
      <div class="form-group">
        <label>Beschreibung</label>
        <input type="text" id="task-title" placeholder="z. B. Mathe S. 42 Nr. 3" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </div>

  <!-- MODAL: ARBEIT -->
  <div id="modal-exam" class="modal-card">
    <h3>Neue Arbeit</h3>
    <form id="form-exam">
      <div class="form-group">
        <label>Fach</label>
        <input type="text" id="exam-subject" placeholder="z. B. Englisch" required>
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="exam-date" required>
      </div>
      <div class="form-group">
        <label>Thema / Stoff</label>
        <input type="text" id="exam-topic" placeholder="z. B. Unit 3 Grammar">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </div>

  <!-- MODAL: NOTE -->
  <div id="modal-grade" class="modal-card">
    <h3>Neue Note</h3>
    <form id="form-grade">
      <div class="form-group">
        <label>Fach</label>
        <input type="text" id="grade-subject" placeholder="z. B. Deutsch" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Note</label>
          <select id="grade-value">
            <option value="1+">1+</option><option value="1">1</option><option value="1-">1-</option>
            <option value="2+">2+</option><option value="2" selected>2</option><option value="2-">2-</option>
            <option value="3+">3+</option><option value="3">3</option><option value="3-">3-</option>
            <option value="4+">4+</option><option value="4">4</option><option value="4-">4-</option>
            <option value="5+">5+</option><option value="5">5</option><option value="5-">5-</option>
            <option value="6">6</option>
          </select>
        </div>
        <div class="form-group">
          <label>Gewichtung</label>
          <select id="grade-weight">
            <option value="0.5">50% (Klassenarbeit)</option>
            <option value="0.25">25% (Test / HÜ)</option>
            <option value="0.25">25% (Mündlich)</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>
  </div>

  <!-- Cache-Busting via Query-Parameter ?v=9.0 -->
  <script src="app.js?v=9.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registriert:', reg.scope))
          .catch(err => console.error('SW Fehler:', err));
      });
    }
  </script>
</body>
</html>
